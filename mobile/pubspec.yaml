name: daansetu
description: DAANSETU - Donation Management Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^13.0.0
  url_launcher: ^6.3.2
  
  # UI Components
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.1.0
  
  # Location
  geolocator: ^10.1.0
  
  # Forms & Validation
  reactive_forms: ^16.1.1
  
  # Image Handling
  image_picker: ^1.2.1
  
  # Utilities
  intl: ^0.20.2
  open_file_plus: any
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  lucide_icons: ^0.257.0
  socket_io_client: ^3.1.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  share_plus: ^12.0.1
  confetti: ^0.8.0
  qr_flutter: ^4.1.0
  fl_chart: ^1.1.1
  flutter_dotenv: ^6.0.0
  tutorial_coach_mark: ^1.3.3
  
  # Connectivity & Storage
  connectivity_plus: ^5.0.0
  path_provider: ^2.1.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  mobile_scanner: ^7.2.0
  speech_to_text: ^7.3.0
  flutter_slidable: ^3.1.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#E23744"
    theme_color: "#E23744"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
